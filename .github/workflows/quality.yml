name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: math-app-26c77
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: math-app-26c77.appspot.com
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Check generated and staged text quality
        run: npm run check:mojibake

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run unit and Firestore security tests
        run: npm test

      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium

      - name: Verify scratch paper editing and result submission
        run: npm run test:e2e:emu -- tests/e2e/drill.spec.ts --grep 計算用紙は問題ごと

      - name: Verify kanji battle lobby, handwriting and results
        env:
          # The browser and Admin SDK must address the same emulated RTDB namespace.
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://math-app-26c77-default-rtdb.asia-southeast1.firebasedatabase.app
        run: npm run test:e2e:emu -- tests/e2e/kanji-battle.spec.ts --reporter=list

      - name: Save kanji battle UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanji-battle-ui
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
