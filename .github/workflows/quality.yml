name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: math-app-26c77
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: math-app-26c77.appspot.com
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Check generated and staged text quality
        run: npm run check:mojibake

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run unit and Firestore security tests
        run: npm test
